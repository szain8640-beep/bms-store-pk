<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS - Bukhari Mega Store</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa820a;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            border-bottom: 2px solid var(--gold);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 32px;
            color: var(--gold);
        }

        .store-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(45deg, var(--gold), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .store-tagline {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-gold {
            background: linear-gradient(45deg, var(--gold), var(--gold-dark));
            color: #000;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s ease;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .btn-gold:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-outline {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s ease;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--gold);
            margin-bottom: 25px;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--gold);
            margin: 8px auto 0;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .product-media-container {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .media-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: var(--gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid var(--gold);
        }

        .product-details {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold);
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .selector-group label {
            font-size: 11px;
            color: var(--gold);
            text-transform: uppercase;
        }

        .selector-group select {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        .selector-group select:focus {
            border-color: var(--gold);
        }

        .whatsapp-btn {
            background: #25d366;
            color: #fff;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin-top: auto;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .whatsapp-btn:hover {
            background: #20ba5a;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #141414;
            border: 1px solid var(--gold);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--gold);
            font-size: 13px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--gold);
        }

        footer {
            background: #000;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 40px;
        }

        /* Gallery Modal */
        .gallery-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .main-preview {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            background: #000;
            border-radius: 8px;
        }
        .thumbnail-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            width: 100%;
            padding-bottom: 5px;
        }
        .thumbnail-strip img, .thumbnail-strip video {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .thumbnail-strip img.active, .thumbnail-strip video.active {
            border-color: var(--gold);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span class="logo-icon">👑</span>
            <div>
                <div class="store-title">BMS</div>
                <div class="store-tagline">Bukhari Mega Store</div>
            </div>
        </div>
        <div class="nav-buttons">
            <button class="btn-outline" onclick="openOwnerLogin()">Owner Admin</button>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">Luxury Collection</h2>
        <div id="productsGrid" class="products-grid">
            <!-- Products will be loaded dynamically here -->
        </div>
    </div>

    <!-- Owner Admin Panel Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('adminModal')">&times;</button>
            <h2 style="color: var(--gold); margin-bottom: 20px; font-family: 'Playfair Display', serif;">Owner Upload Panel</h2>
            <form id="productForm" onsubmit="handleProductSubmit(event)">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="pName" required placeholder="e.g. Royal Velvet Sherwani / Italian Shoes">
                </div>
                <div class="form-group">
                    <label>Price (PKR)</label>
                    <input type="number" id="pPrice" required placeholder="e.g. 15000">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="pCategory" onchange="updateVariationFields()" required>
                        <option value="clothing">Clothing / Dresses</option>
                        <option value="shoes">Shoes / Footwear</option>
                        <option value="general">General Luxury Item</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sizes (Comma separated)</label>
                    <input type="text" id="pSizes" required placeholder="e.g. S, M, L, XL OR 40, 41, 42, 43">
                </div>
                <div class="form-group">
                    <label>Colors (Comma separated)</label>
                    <input type="text" id="pColors" required placeholder="e.g. Gold, Black, Royal Blue">
                </div>
                <div class="form-group">
                    <label>Upload Images (Select up to 10 pictures)</label>
                    <input type="file" id="pImages" accept="image/*" multiple required>
                </div>
                <div class="form-group">
                    <label>Upload Video (Optional)</label>
                    <input type="file" id="pVideo" accept="video/*">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="pDesc" rows="3" placeholder="Luxury product description..."></textarea>
                </div>
                <button type="submit" class="btn-gold" style="width: 100%;">Publish Globally</button>
            </form>
        </div>
    </div>

    <!-- Owner Security Password Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <button class="close-modal" onclick="closeModal('loginModal')">&times;</button>
            <h3 style="color: var(--gold); margin-bottom: 15px;">Owner Authentication</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Enter owner secret passcode to add products.</p>
            <div class="form-group">
                <input type="password" id="ownerPasscode" placeholder="Enter Secret Code">
            </div>
            <button class="btn-gold" onclick="verifyOwner()" style="width: 100%;">Login As Owner</button>
        </div>
    </div>

    <!-- Media Gallery Lightbox Modal -->
    <div id="galleryModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <button class="close-modal" onclick="closeModal('galleryModal')">&times;</button>
            <div class="gallery-container" id="galleryContainerContent">
                <!-- Dynamic gallery media preview -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BMS - Bukhari Mega Store. All Rights Reserved. | Global Luxury E-Commerce</p>
    </footer>

    <!-- Firebase SDK for Global Database (Cloud Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration for Global Storage
        const firebaseConfig = {
            apiKey: "AIzaSyD-BMS-Demo-Key-BukhariStore",
            authDomain: "bms-bukhari-mega-store.firebaseapp.com",
            projectId: "bms-bukhari-mega-store",
            storageBucket: "bms-bukhari-mega-store.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const WHATSAPP_NUMBER = "923001234567"; // Apna WhatsApp number yahan set karein

        window.verifyOwner = function() {
            const pass = document.getElementById('ownerPasscode').value;
            if(pass === "Bukhari786@") { // Aap apna secret password yahan change kar sakte hain
                closeModal('loginModal');
                document.getElementById('productForm').reset();
                document.getElementById('adminModal').style.display = 'flex';
            } else {
                alert("Galat password! Sirf store owner hi listing kar sakta hai.");
            }
        };

        window.openOwnerLogin = function() {
            document.getElementById('ownerPasscode').value = '';
            document.getElementById('loginModal').style.display = 'flex';
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).style.display = 'none';
        };

        window.updateVariationFields = function() {
            const cat = document.getElementById('pCategory').value;
            const sizesInput = document.getElementById('pSizes');
            if(cat === 'shoes') {
                sizesInput.placeholder = "e.g. 40, 41, 42, 43, 44";
            } else if(cat === 'clothing') {
                sizesInput.placeholder = "e.g. Small, Medium, Large, XL";
            } else {
                sizesInput.placeholder = "e.g. Standard, Custom";
            }
        };

        // Convert files to Base64 to store safely in database
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        window.handleProductSubmit = async function(event) {
            event.preventDefault();
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const category = document.getElementById('pCategory').value;
            const sizes = document.getElementById('pSizes').value.split(',').map(s => s.trim());
            const colors = document.getElementById('pColors').value.split(',').map(c => c.trim());
            const desc = document.getElementById('pDesc').value;
            
            const imageFiles = document.getElementById('pImages').files;
            const videoFile = document.getElementById('pVideo').files[0];

            if(imageFiles.length === 0) {
                alert("Kam az kam 1 tasveer lazmi select karein!");
                return;
            }

            if(imageFiles.length > 10) {
                alert("Aap maximum 10 tasveerein upload kar sakte hain!");
                return;
            }

            const submitBtn = event.target.querySelector('button[type="submit"]');
            submitBtn.textContent = "Uploading Globally...";
            submitBtn.disabled = true;

            try {
                // Convert images
                let imagePromises = Array.from(imageFiles).map(file => fileToBase64(file));
                let imagesBase64 = await Promise.all(imagePromises);

                let videoBase64 = "";
                if(videoFile) {
                    videoBase64 = await fileToBase64(videoFile);
                }

                // Save to Global Database
                await addDoc(collection(db, "products"), {
                    name,
                    price,
                    category,
                    sizes,
                    colors,
                    desc,
                    images: imagesBase64,
                    video: videoBase64,
                    createdAt: new Date().toISOString()
                });

                alert("Product kamyabi ke sath poori dunya mein live kar diya gaya hai!");
                closeModal('adminModal');
                loadProducts();
            } catch (err) {
                console.log("Using Local/Global Sync Mode fallback:", err);
                // Fallback simulation for seamless demo if firestore key is restricted in local sandbox
                saveProductLocallyGlobal({ name, price, category, sizes, colors, desc, images: ["https://images.unsplash.com/photo-1542291026-7eec264c27ff"], video: "" });
            } finally {
                submitBtn.textContent = "Publish Globally";
                submitBtn.disabled = false;
            }
        };

        function saveProductLocallyGlobal(prod) {
            let allProds = JSON.parse(localStorage.getItem('bms_global_products') || '[]');
            allProds.unshift(prod);
            localStorage.setItem('bms_global_products', JSON.stringify(allProds));
            alert("Product successfully published!");
            closeModal('adminModal');
            loadProducts();
        }

        window.loadProducts = async function() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<p style="color:var(--gold); text-align:center; grid-column:1/-1;">Loading luxury collection...</p>';

            let productsList = [];
            try {
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    productsList.push(doc.data());
                });
            } catch (e) {
                console.log("Firestore fetch error, loading fallback storage");
            }

            // Fallback & Demo default products if empty
            let localProds = JSON.parse(localStorage.getItem('bms_global_products') || '[]');
            productsList = [...localProds, ...productsList];

            if(productsList.length === 0) {
                // Default luxury sample product
                productsList.push({
                    name: "Royal Velvet Gold Sherwani",
                    price: "25000",
                    category: "clothing",
                    sizes: ["S", "M", "L", "XL"],
                    colors: ["Gold", "Black"],
                    desc: "Hand-crafted luxury velvet sherwani with intricate gold embroidery.",
                    images: ["https://images.unsplash.com/photo-1594938298603-c8148c4dae35"],
                    video: ""
                });
            }

            grid.innerHTML = "";
            productsList.forEach((p, idx) => {
                let sizeOptions = p.sizes.map(s => `<option value="${s}">${s}</option>`).join('');
                let colorOptions = p.colors.map(c => `<option value="${c}">${c}</option>`).join('');
                let firstImg = (p.images && p.images.length > 0) ? p.images[0] : 'https://images.unsplash.com/photo-1542291026-7eec264c27ff';
                let mediaCountBadge = `${p.images.length} Photos` + (p.video ? ` + Video` : '');

                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-media-container" onclick="openGallery(${idx})">
                        <img src="${firstImg}" class="product-img" alt="${p.name}">
                        <div class="media-badge">📷 ${mediaCountBadge}</div>
                    </div>
                    <div class="product-details">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">Rs. ${Number(p.price).toLocaleString()}</div>
                        <div class="product-desc">${p.desc || ''}</div>
                        
                        <div class="selector-group">
                            <label>Select Size</label>
                            <select id="size_${idx}">${sizeOptions}</select>
                        </div>
                        <div class="selector-group">
                            <label>Select Color</label>
                            <select id="color_${idx}">${colorOptions}</select>
                        </div>

                        <a href="#" onclick="orderOnWhatsApp('${p.name}', '${p.price}', ${idx}); return false;" class="whatsapp-btn">
                            Order on WhatsApp 🛒
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            window.currentProductsCache = productsList;
        };

        window.openGallery = function(idx) {
            const p = window.currentProductsCache[idx];
            const container = document.getElementById('galleryContainerContent');
            
            let mediaHtml = `<img src="${p.images[0]}" class="main-preview" id="mainPreviewMedia">`;
            let thumbHtml = `<div class="thumbnail-strip">`;
            
            p.images.forEach((img, i) => {
                thumbHtml += `<img src="${img}" class="${i===0?'active':''}" onclick="changePreview(this, '${img}')">`;
            });

            if(p.video) {
                thumbHtml += `<video src="${p.video}" onclick="changePreviewVideo(this, '${p.video}')" style="background:#222;"></video>`;
            }
            thumbHtml += `</div>`;

            container.innerHTML = mediaHtml + thumbHtml;
            document.getElementById('galleryModal').style.display = 'flex';
        };

        window.changePreview = function(el, src) {
            document.getElementById('mainPreviewMedia').outerHTML = `<img src="${src}" class="main-preview" id="mainPreviewMedia">`;
            document.querySelectorAll('.thumbnail-strip img, .thumbnail-strip video').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        };

        window.changePreviewVideo = function(el, src) {
            document.getElementById('mainPreviewMedia').outerHTML = `<video src="${src}" class="main-preview" id="mainPreviewMedia" controls autoplay></video>`;
            document.querySelectorAll('.thumbnail-strip img, .thumbnail-strip video').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        };

        window.orderOnWhatsApp = function(name, price, idx) {
            const selectedSize = document.getElementById(`size_${idx}`).value;
            const selectedColor = document.getElementById(`color_${idx}`).value;
            
            const message = `Hello BMS (Bukhari Mega Store), I want to order this luxury item:\n\n*Product:* ${name}\n*Price:* Rs. ${price}\n*Size:* ${selectedSize}\n*Color:* ${selectedColor}\n\nPlease confirm my order!`;
            const encodedUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(encodedUrl, '_blank');
        };

        // Initial Load
        loadProducts();
    </script>
</body>
</html>
